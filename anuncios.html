<script>
/* ================= CONFIG PANTALLA ================= */
const TIMEZONES = {
  local:  { tz:'America/Monterrey', elTime:'clockLocal', elDate:'dateLocal' },
};
const SLIDE_DURATION = 10000; // m/s por anuncio

// Relojes de referencia mundial que se muestran debajo de la hora local.
// Dos grupos de 6 que se van alternando solos cada minuto (ver updateClocks).
const WORLD_CLOCK_GROUPS = [
  [
    { city:'Tijuana',       tz:'America/Tijuana' },
    { city:'Cd. de México', tz:'America/Mexico_City' },
    { city:'New York',      tz:'America/New_York' },
    { city:'Londres',       tz:'Europe/London' },
    { city:'París',         tz:'Europe/Paris' },
    { city:'Pekín',         tz:'Asia/Shanghai' },
  ],
  [
    { city:'Los Ángeles', tz:'America/Los_Angeles' },
    { city:'Chicago',     tz:'America/Chicago' },
    { city:'Toronto',     tz:'America/Toronto' },
    { city:'São Paulo',   tz:'America/Sao_Paulo' },
    { city:'Dubái',       tz:'Asia/Dubai' },
    { city:'Tokio',       tz:'Asia/Tokyo' },
  ],
];
let worldClockGroupIndex = null; // para saber cuándo cambia y disparar la animación de deslizamiento

// Pinta hora + AM/PM de las 6 ciudades del grupo indicado en las casillas cityN/hourN.
function renderWorldClockGroup(idx, now){
  WORLD_CLOCK_GROUPS[idx].forEach((w, i) => {
    const fmt = new Intl.DateTimeFormat('en-US', { timeZone: w.tz, hour:'numeric', minute:'2-digit', hour12:true });
    const p = Object.fromEntries(fmt.formatToParts(now).map(x=>[x.type,x.value]));
    document.getElementById(`city${i}`).textContent = w.city;
    document.getElementById(`hour${i}`).innerHTML = `${p.hour}:${p.minute}<span class="ampm">${p.dayPeriod}</span>`;
  });
}

// Número de semana ISO-8601 de una fecha (lunes = inicio de semana).
function getWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

/* ================= RELOJES ================= */
function updateClocks(){
  const now = new Date();

  // Reloj local grande (12h, con AM/PM chiquito y segundos)
  const localFmt = new Intl.DateTimeFormat('en-US', { timeZone: TIMEZONES.local.tz, hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true });
  const parts = Object.fromEntries(localFmt.formatToParts(now).map(p=>[p.type,p.value]));
  document.getElementById('clockLocal').innerHTML = `${parts.hour}:${parts.minute}<span class="ampm">${parts.dayPeriod}</span><span class="secs">${parts.second}</span>`;

  const dateFmt = new Intl.DateTimeFormat('es-MX', { timeZone: TIMEZONES.local.tz, weekday:'long', day:'numeric', month:'long' });
  const ymdFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TIMEZONES.local.tz, year:'numeric', month:'2-digit', day:'2-digit' });
  const [y, m, d] = ymdFmt.format(now).split('-').map(Number);
  const week = getWeekNumber(new Date(y, m - 1, d));
  document.getElementById('dateLocal').textContent = `${dateFmt.format(now)}, Semana ${week}`;

  // Relojes de referencia (hora:minuto, 12h con AM/PM chiquito).
  const groupIndex = Math.floor(now.getTime() / 60000) % WORLD_CLOCK_GROUPS.length;
  if(groupIndex !== worldClockGroupIndex){
    worldClockGroupIndex = groupIndex;
    const worldClocksEl = document.getElementById('worldClocks');
    worldClocksEl.classList.add('wc-slide-out'); // las 6 actuales se deslizan a la derecha y desaparecen
    setTimeout(() => {
      renderWorldClockGroup(groupIndex, new Date());
      worldClocksEl.classList.remove('wc-slide-out');
      worldClocksEl.classList.add('wc-slide-in'); // 
      void worldClocksEl.offsetWidth; // fuerza reflow para poder animar el siguiente cambio
      worldClocksEl.classList.remove('wc-slide-in'); // y ahora sí entran deslizándose a su lugar
    }, 450);
  } else {
    renderWorldClockGroup(groupIndex, now);
  }
}
setInterval(updateClocks, 1000);
updateClocks();

/* ================= CLIMA (Open-Meteo, sin API key) ================= */
const WEATHER_LAT = 25.1953;
const WEATHER_LON = -99.8275;
const WEATHER_REFRESH = 30 * 60 * 1000; // cada 30 min

// Códigos de clima WMO que usa Open-Meteo -> ícono + descripción en español
function weatherInfo(code){
  const map = {
    0: ['bi-sun-fill', 'Despejado'],
    1: ['bi-brightness-high-fill', 'Mayormente despejado'],
    2: ['bi-cloud-sun-fill', 'Parcialmente nublado'],
    3: ['bi-clouds-fill', 'Nublado'],
    45: ['bi-cloud-fog2-fill', 'Niebla'],
    48: ['bi-cloud-fog2-fill', 'Niebla helada'],
    51: ['bi-cloud-drizzle-fill', 'Llovizna ligera'],
    53: ['bi-cloud-drizzle-fill', 'Llovizna'],
    55: ['bi-cloud-drizzle-fill', 'Llovizna intensa'],
    61: ['bi-cloud-rain-fill', 'Lluvia ligera'],
    63: ['bi-cloud-rain-fill', 'Lluvia'],
    65: ['bi-cloud-rain-heavy-fill', 'Lluvia intensa'],
    71: ['bi-snow', 'Nieve ligera'],
    73: ['bi-snow', 'Nieve'],
    75: ['bi-snow', 'Nieve intensa'],
    80: ['bi-cloud-rain-fill', 'Chubascos'],
    81: ['bi-cloud-rain-fill', 'Chubascos'],
    82: ['bi-cloud-rain-heavy-fill', 'Chubascos intensos'],
    95: ['bi-cloud-lightning-rain-fill', 'Tormenta'],
    96: ['bi-cloud-lightning-rain-fill', 'Tormenta con granizo'],
    99: ['bi-cloud-lightning-rain-fill', 'Tormenta con granizo'],
  };
  return map[code] || ['bi-cloud-fill', 'Sin datos'];
}

// Esta función obtiene el clima actual y lo muestra en su propia tarjeta fija.
async function updateWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FMonterrey`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('weather http error');
    const data = await res.json();

    const [iconClass, label] = weatherInfo(data.current.weather_code);
    document.getElementById('weatherIcon').className = `bi ${iconClass} weather-icon`;
    document.getElementById('weatherTemp').textContent = `${Math.round(data.current.temperature_2m)}°`;
    document.getElementById('weatherDesc').textContent = label;
    document.getElementById('weatherMax').textContent = `${Math.round(data.daily.temperature_2m_max[0])}°`;
    document.getElementById('weatherMin').textContent = `${Math.round(data.daily.temperature_2m_min[0])}°`;
  }catch(e){
    document.getElementById('weatherDesc').textContent = 'Clima no disponible';
  }
}
/* ================= PANEL ROTATIVO: cumpleaños / palabra del día ================= */

          <div class="birthday-item" key="${index}">
            <div class="birthday-avatar ${b.photo ? 'has-photo' : ''}">
              ${b.photo ? `<img src="${b.photo}" alt="${escapeHtml(b.name)}">` : escapeHtml(initials(b.name))}
            </div>
            <div class="birthday-info">
              <div class="birthday-name">${escapeHtml(b.name)}</div>
              <div class="birthday-date">${b.day} de ${BIRTHDAY_MONTH_NAMES[b.month - 1]} de ${new Date().getFullYear()}</div>
            </div>

}

// Esta función genera el HTML del panel de versículo del día.
function versePanelHtml(verse){

    <div class="verse-title"><i class="bi bi-book-half"></i> Versículo del día</div>
    <div class="verse-text">${escapeHtml(verse.text)}</div>
    <div class="verse-ref">${escapeHtml(verse.reference)}</div>
  `;
}

// Cumpleaños y versículo ahora son tarjetas independientes y fijas (ya no se turnan);
// cada una se oculta sola si no tiene contenido que mostrar.
function refreshInfoPanels(){
  const birthdayCard = document.getElementById('birthdayCard');
  const thisMonthBirthdays = loadBirthdays()
    .filter(b => isBirthdayInCurrentMonth(b.month))
    .sort((a,b)=> a.day - b.day);
  if(thisMonthBirthdays.length > 0){
    birthdayCard.style.display = 'flex';
    birthdayCard.innerHTML = birthdayPanelHtml(thisMonthBirthdays);
  }else{
    birthdayCard.style.display = 'none';
  }

  const verseCard = document.getElementById('verseCard');
  const verse = loadDisplayVerse();
  if(verse){
    verseCard.style.display = 'flex';
    verseCard.innerHTML = versePanelHtml(verse);
  }else{
    verseCard.style.display = 'none';
  }
}

refreshInfoPanels();
updateWeather();
setInterval(updateWeather, WEATHER_REFRESH);

// Versículo automático: se trae de la API solo si no hay uno cacheado para hoy,
// y se revisa cada rato para detectar el cambio de día sin recargar la pantalla.
const AUTO_VERSE_CHECK = 30 * 60 * 1000; // cada 30 min
refreshAutoVerse().then(changed => { if(changed && !loadVerse()) refreshInfoPanels(); });
setInterval(() => {
  refreshAutoVerse().then(changed => { if(changed && !loadVerse()) refreshInfoPanels(); });
}, AUTO_VERSE_CHECK);

let announcements = loadAnnouncements();
let videos = seedDefaultVideosIfNeeded(loadVideos());
let playlist = [];
let currentSlide = 0;
let carouselTimer = null;

/* ================= YOUTUBE IFRAME API ================= */
let ytApiReady = false;
let ytApiLoading = false;
const pendingPlayerInits = [];
let ytPlayers = {};
const playersPendingAutoplay = new Set();

function loadYouTubeAPI(){
  if(ytApiLoading || ytApiReady) return;
  ytApiLoading = true;
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady = function(){
  ytApiReady = true;
  pendingPlayerInits.forEach(fn=>fn());
  pendingPlayerInits.length = 0;
};

// Esta función inicializa un reproductor de YouTube 
function initYouTubePlayer(elementId, videoId, slideIndex){
  const create = ()=>{
    ytPlayers[slideIndex] = new YT.Player(elementId, {
      videoId,
      playerVars:{ autoplay:0, mute:1, controls:0, rel:0, modestbranding:1, iv_load_policy:3, playsinline:1, disablekb:1, fs:0 },
      events:{
        onReady:()=>{
          if(playersPendingAutoplay.has(slideIndex)){
            playersPendingAutoplay.delete(slideIndex);
            ytPlayers[slideIndex].playVideo();
          }
        },
        onStateChange:(e)=>{
          if(e.data === YT.PlayerState.ENDED) goToNext();
        }
      }
    });
  };
  if(ytApiReady && window.YT && window.YT.Player){
    create();
  }else{
    pendingPlayerInits.push(create);
    loadYouTubeAPI();
  }
}

/* ================= CARRUSEL ================= */
// Pastilla de cuenta regresiva para anuncios con fecha de evento;  si el anuncio no tiene fecha.
function eventBadgeHtml(dateStr){
  const days = daysUntilEvent(dateStr);
  if(days === null) return '';
  let label = `Faltan ${days} días`;
  let cls = '';
  if(days === 1) label = 'Mañana';
  else if(days === 0) label = 'Hoy';
  else if(days < 0){ label = 'Ya pasó'; cls = ' past'; }
  return `<div class="slide-event-badge${cls}">${label}</div>`;
}

function buildPlaylist(){
  const list = [];
  const maxLen = Math.max(announcements.length, videos.length);
  for(let i=0;i<maxLen;i++){
    if(i < announcements.length) list.push({ kind:'anuncio', data: announcements[i] });
    if(i < videos.length) list.push({ kind:'video', data: videos[i] });
  }
  return list;
}

function renderCarousel(){
  const carousel = document.getElementById('carousel');
  const dotsWrap = document.getElementById('dots');
  carousel.querySelectorAll('.slide').forEach(s=>s.remove());
  dotsWrap.innerHTML = '';
  if(carouselTimer){ clearInterval(carouselTimer); carouselTimer = null; }
  Object.values(ytPlayers).forEach(p=>{ try{ p.destroy(); }catch(e){} });
  ytPlayers = {};
  playersPendingAutoplay.clear();

  const emptyState = document.getElementById('emptyState');
  playlist = buildPlaylist();

  if(playlist.length === 0){
    emptyState.style.display = 'flex';
    return;
  }
  emptyState.style.display = 'none';

  let aCount = 0, vCount = 0;
  playlist.forEach((item, i)=>{
    const slide = document.createElement('div');

    if(item.kind === 'video'){
      vCount++;
      const v = item.data;
      const playerId = `yt-player-${i}`;
      slide.className = 'slide slide-video';
      slide.dataset.index = i;
      slide.innerHTML = `
        <div class="slide-eyebrow">Video ${vCount} de ${videos.length}</div>
        <div class="slide-video-wrap"><div id="${playerId}"></div></div>
        ${v.title ? `<div class="slide-video-title">${escapeHtml(v.title)}</div>` : ''}
      `;
      carousel.appendChild(slide);
      initYouTubePlayer(playerId, v.youtubeId, i);
    }else{
      aCount++;
      const a = item.data;
      slide.className = 'slide' + (a.image ? '' : ' text-only');
      slide.dataset.index = i;
      slide.innerHTML = `
        <div class="slide-eyebrow">Anuncio ${aCount} de ${announcements.length}</div>
        ${a.image ? `<div class="slide-img-frame">${eventBadgeHtml(a.eventDate)}<div class="slide-img-wrap"><img src="${a.image}" alt="${escapeHtml(a.title)}"></div></div>` : eventBadgeHtml(a.eventDate)}
        <div class="slide-title">${escapeHtml(a.title)}</div>
        ${a.desc ? `<div class="slide-desc">${escapeHtml(a.desc)}</div>` : ''}
      `;
      carousel.appendChild(slide);

      if(a.image){
        // Ajusta el marco a la proporción real de la foto para que no quede espacio vacío alrededor.
        const wrapEl = slide.querySelector('.slide-img-frame');
        const imgEl = wrapEl.querySelector('img');
        const applyRatio = ()=>{
          if(imgEl.naturalWidth && imgEl.naturalHeight){
            wrapEl.style.aspectRatio = `${imgEl.naturalWidth} / ${imgEl.naturalHeight}`;
          }
        };
        if(imgEl.complete) applyRatio();
        else imgEl.addEventListener('load', applyRatio);
      }
    }

    const dot = document.createElement('div');
    dot.className = 'dot';
    dotsWrap.appendChild(dot);
  });

  if(currentSlide >= playlist.length) currentSlide = 0;
  showSlide(currentSlide);
}

// Muestra el slide en el índice dado, pausando cualquier video que se esté reproduciendo
function showSlide(idx){
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');

  const leaving = playlist[currentSlide];
  if(leaving && leaving.kind === 'video'){
    const p = ytPlayers[currentSlide];
    if(p && typeof p.pauseVideo === 'function'){
      p.pauseVideo();
      p.seekTo(0);
    }
  }

  slides.forEach((s,i)=> s.classList.toggle('active', i===idx));
  dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
  currentSlide = idx;

  if(carouselTimer){ clearInterval(carouselTimer); carouselTimer = null; }

  const current = playlist[idx];
  if(!current) return;

  if(current.kind === 'video'){
    const p = ytPlayers[idx];
    if(p && typeof p.playVideo === 'function'){
      p.playVideo();
    }else{
      playersPendingAutoplay.add(idx);
    }
  }else if(playlist.length > 1){
    carouselTimer = setInterval(goToNext, SLIDE_DURATION);
  }
}
// Avanza al siguiente slide, o vuelve al primero si estamos en el último.
function goToNext(){
  if(playlist.length === 0) return;
  showSlide((currentSlide + 1) % playlist.length);
}

function goToPrev(){
  if(playlist.length === 0) return;
  showSlide((currentSlide - 1 + playlist.length) % playlist.length);
}

document.getElementById('skipToggle').addEventListener('click', goToNext);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goToNext();
  if(e.key === 'ArrowLeft') goToPrev();
});

/* Si el editor está abierto en otra pestaña del mismo navegador, refleja los cambios de inmediato. */
window.addEventListener('storage', (e)=>{
  if(e.key === STORAGE_KEY || e.key === STORAGE_KEY_VIDEOS){
    announcements = loadAnnouncements();
    videos = loadVideos();
    renderCarousel();
  }
  if(e.key === STORAGE_KEY_BIRTHDAYS || e.key === STORAGE_KEY_VERSE || e.key === STORAGE_KEY_AUTO_VERSE){
    refreshInfoPanels();
  }
});

/* ================= CUIDADO DE PANTALLA (anti-quemado) =================*/
const PIXEL_SHIFT_INTERVAL = 5 * 60 * 1000; // cada 5 min
const PIXEL_SHIFT_OFFSETS = [
  {x:0,y:0}, {x:3,y:1}, {x:-2,y:2}, {x:1,y:-3}, {x:-3,y:-1}, {x:2,y:-2}, {x:-1,y:3},
];
let pixelShiftIndex = 0;
function applyPixelShift(){
  const offset = PIXEL_SHIFT_OFFSETS[pixelShiftIndex % PIXEL_SHIFT_OFFSETS.length];
  pixelShiftIndex++;
  document.getElementById('stageRoot').style.transform = `translate(${offset.x}px, ${offset.y}px)`;
}
setInterval(applyPixelShift, PIXEL_SHIFT_INTERVAL);
applyPixelShift();

/* ---- Protector de pantalla animado (burbujas) que se muestra durante el reposo ---- */
let bubbleCanvas = null, bubbleCtx = null, bubbles = [], bubbleTimer = null;

function resizeBubbleCanvas(){
  if(!bubbleCanvas) return;
  bubbleCanvas.width = window.innerWidth;
  bubbleCanvas.height = window.innerHeight;
}
// Crea un conjunto de burbujas con posiciones, tamaños y velocidades aleatorias.
function createBubbles(){
  bubbles = Array.from({ length: 18 }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * (window.innerHeight + 200) - 100, 
    r: 18 + Math.random() * 42,
    vy: 0.15 + Math.random() * 0.35,
    vx: (Math.random() - 0.5) * 0.25,
    hue: Math.random() < 0.5 ? '255,201,77' : '94,234,212', 
    opacity: 0.10 + Math.random() * 0.18,
  }));
}
// Dibuja un frame de animación de burbujas, moviéndolas y aplicando relleno, borde y brillo.
function drawBubblesFrame(){
  bubbleCtx.clearRect(0, 0, bubbleCanvas.width, bubbleCanvas.height);
  bubbles.forEach(b=>{
    b.y -= b.vy;
    b.x += b.vx;
    if(b.y + b.r < 0){ b.y = bubbleCanvas.height + b.r; b.x = Math.random() * bubbleCanvas.width; }
    if(b.x - b.r > bubbleCanvas.width) b.x = -b.r;
    if(b.x + b.r < 0) b.x = bubbleCanvas.width + b.r;

    // Relleno: se mantiene sólido hasta cerca del borde, sin difuminarse desde el centro.
    const fill = bubbleCtx.createRadialGradient(b.x, b.y, b.r * 0.15, b.x, b.y, b.r);
    fill.addColorStop(0, `rgba(${b.hue},${b.opacity})`);
    fill.addColorStop(0.75, `rgba(${b.hue},${b.opacity})`);
    fill.addColorStop(1, `rgba(${b.hue},0)`);
    bubbleCtx.fillStyle = fill;
    bubbleCtx.beginPath();
    bubbleCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    bubbleCtx.fill();

    // Borde definido tipo burbuja de jabón.
    bubbleCtx.strokeStyle = `rgba(${b.hue},${Math.min(b.opacity * 2.2, 0.65)})`;
    bubbleCtx.lineWidth = 1.5;
    bubbleCtx.stroke();

    // Brillo (highlight) para dar sensación de vidrio/burbuja.
    bubbleCtx.beginPath();
    bubbleCtx.ellipse(b.x - b.r*0.35, b.y - b.r*0.35, b.r*0.18, b.r*0.12, -0.6, 0, Math.PI * 2);
    bubbleCtx.fillStyle = `rgba(255,255,255,${Math.min(b.opacity * 1.6, 0.4)})`;
    bubbleCtx.fill();
  });
}
// Inicia el protector de pantalla de burbujas, creando el canvas y los elementos si es la primera vez.
function startBubbleScreensaver(){
  if(!bubbleCanvas){
    bubbleCanvas = document.getElementById('offHoursCanvas');
    bubbleCtx = bubbleCanvas.getContext('2d');
    window.addEventListener('resize', resizeBubbleCanvas);
  }
  resizeBubbleCanvas();
  createBubbles();
  if(bubbleTimer) clearInterval(bubbleTimer);
  bubbleTimer = setInterval(drawBubblesFrame, 1000 / 30); // 30 fps, liviano para hardware modesto
}

function stopBubbleScreensaver(){
  if(bubbleTimer){ clearInterval(bubbleTimer); bubbleTimer = null; }
}

let offHoursActive = false; // solo cambia con el botón luna/sol, no hay horario automático

/* ---- Botón manual: luna para activar el protector, sol para volver al contenido ---- */
const screensaverToggle = document.getElementById('screensaverToggle');
function updateScreensaverToggleIcon(active){
  screensaverToggle.innerHTML = active
    ? '<i class="bi bi-sun-fill"></i>'
    : '<i class="bi bi-moon-stars-fill"></i>';
  screensaverToggle.title = active ? 'Volver a mostrar contenido' : 'Activar protector de pantalla';
}
screensaverToggle.addEventListener('click', () => {
  if(offHoursActive) exitOffHours();
  else enterOffHours();
});
//funcion de encendido del protector de pantalla
function enterOffHours(){
  updateScreensaverToggleIcon(true);
  if(offHoursActive === true) return;
  offHoursActive = true;
  document.getElementById('offHoursOverlay').classList.add('active');
  if(carouselTimer){ clearInterval(carouselTimer); carouselTimer = null; }
  Object.values(ytPlayers).forEach(p=>{ try{ if(typeof p.pauseVideo === 'function') p.pauseVideo(); }catch(e){} });
  startBubbleScreensaver();
}
//funcion de apagado del protector de pantalla
function exitOffHours(){
  updateScreensaverToggleIcon(false);
  if(offHoursActive === false) return;
  offHoursActive = false;
  document.getElementById('offHoursOverlay').classList.remove('active');
  stopBubbleScreensaver();
  renderCarousel();
}
renderCarousel(); // primer dibujo del carrusel al cargar la página

setTimeout(()=> location.reload(), 60 * 60 * 1000);
</script>
